# mosquitto.dev.conf — OPEN broker configuration (no security).
#
# Anonymous access on plain TCP 1883 only. This is the DEFAULT the stack boots
# with (MOSQUITTO_CONF=mosquitto.dev.conf) so scaling/throughput tests run with
# zero auth/TLS overhead and no certificate or password setup.
#
# To run secured instead, generate the password file and certificates, then set
# MOSQUITTO_CONF=mosquitto.conf. See the README "Security" section.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
