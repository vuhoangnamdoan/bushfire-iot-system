# mosquitto.conf — SECURED broker configuration.
#
# Requires a username/password on every connection (no anonymous access) and
# offers two listeners:
#   1883  authenticated, plain TCP  — kept for local runs / scaling tests that
#                                     opt into auth but not TLS.
#   8883  authenticated, TLS (MQTTS) — encrypted transport for real clients.
#
# Prerequisites before starting the broker with THIS file:
#   1. Password file:   ./security/gen-passwd.sh   (writes mqtt/passwd)
#   2. TLS certificates: ./security/gen-certs.sh    (writes security/*.crt|key)
#
# Selected via docker-compose:  MOSQUITTO_CONF=mosquitto.conf
# For an open, no-security broker (default for scaling tests) use
# mosquitto.dev.conf instead (MOSQUITTO_CONF=mosquitto.dev.conf).

persistence true
persistence_location /mosquitto/data/

# --- Authentication (applies to all listeners) -----------------------------
# No anonymous clients; credentials are checked against the password file that
# gen-passwd.sh creates. The file is mounted read-only into the container.
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Listener 1: authenticated plain TCP -----------------------------------
listener 1883

# --- Listener 2: authenticated TLS (MQTTS) ---------------------------------
listener 8883
cafile   /mosquitto/security/ca.crt
certfile /mosquitto/security/broker.crt
keyfile  /mosquitto/security/broker.key
# Server-only TLS: clients trust the CA but do not present a client cert.
require_certificate false
tls_version tlsv1.2
